name: Release

# Builds the plugin in CI, signs each release asset with a sigstore build
# provenance attestation, and attaches the assets to the GitHub Release for
# a tag. Two triggers:
#
#   1. push:        when a release tag is pushed to polleoai/gryphon, the
#                   workflow fires automatically and uses the pushed tag.
#                   This is the normal path for new releases.
#
#   2. workflow_dispatch: a maintainer can manually fire the workflow
#                   against an existing tag (e.g., to retroactively attest
#                   a release whose initial tag push didn't fire the
#                   workflow because the workflow file was introduced in
#                   the same commit — GitHub's first-run chicken-and-egg).
#                   Provide the tag as the "tag" input.
#
# A second job, npm-stage, then stages the four @polleoai/gryphon-* npm
# packages for the maintainer to approve (see that job's comment).
#
# Why this exists: Obsidian's Community Plugins scorecard flags release
# assets that are missing GitHub artifact attestations. Locally-uploaded
# assets can't be meaningfully attested (the trust model wants "this binary
# was produced by this workflow from this commit"), so the build is owned
# by CI.
#
# Tag format follows Obsidian's rule: bare semver, no leading "v" (1.5.2,
# not v1.5.2). cut-public-release.sh pushes the tag; this workflow takes
# over from there.
#
# Release ownership: this workflow OWNS the release body and asset files
# for any tag it processes. On workflow_dispatch re-runs against an
# existing release, the body is replaced by the matching CHANGELOG slice
# and the named assets (main.js, manifest.json, styles.css) are
# re-uploaded with sigstore attestations. Any handcrafted edits to a
# release body or those asset files will be reverted by the next run —
# do not maintain release content manually.
#
# Asset scope: Obsidian's Community Plugins installer only consumes
# main.js, manifest.json, and styles.css. We deliberately do NOT attach
# an install zip — the v1.6.1 scorecard scan flagged it as an ignored
# asset (Recommendation, 2026-05-17). The hooks/ tree ships inside
# main.js's bundling step, so a separate archive is unnecessary.
#
# Security notes: every run: block uses $TAG_NAME (env-var form, derived
# from controlled sources — either a pushed Git tag, which Git constrains
# to a safe character set, or the workflow_dispatch input, which only a
# repo maintainer can supply). The Validate-TAG_NAME-shape step rejects
# any tag value that doesn't match the bare-semver-plus-optional-rcN
# shape, defending against typos in workflow_dispatch inputs and against
# any regex-metachar splice into the awk pattern that extracts CHANGELOG
# release notes. Values from controlled files (CHANGELOG, manifest) are
# also used. No user-controlled event payload is spliced into a shell.

# Actions are pinned to full commit SHAs (version in the trailing comment):
# this workflow signs release assets and stages npm packages, so a moved tag
# upstream must not change what runs here. Bump deliberately.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'  # pre-release tags (rc1, rc2, …)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)build and attest, e.g. 1.5.2'
        required: true
        type: string

permissions:
  contents: write       # create/update the GitHub Release
  id-token: write       # OIDC token used for sigstore signing
  attestations: write   # publish the attestation to GitHub

env:
  # Resolves to the input tag on manual dispatch, or the pushed tag on
  # the push trigger. Used by every downstream step instead of github.ref_name
  # so the two triggers share the same code path.
  TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate TAG_NAME shape
        # Reject any tag that doesn't match bare semver (X.Y.Z) or a
        # pre-release variant (X.Y.Z-suffix where suffix is alphanumeric
        # plus dots). Each numeric component must NOT have leading zeros
        # — semver.org §2 forbids them, and Obsidian Community Plugins
        # rejects `01.5.2`-shaped tags too.
        #
        # Defends against (a) typos in workflow_dispatch inputs, (b) any
        # regex-metachar splice into the awk CHANGELOG extractor
        # downstream. The push:tags filter is intentionally looser
        # (glob-only, no numeric-shape enforcement) — this validator is
        # the actual gate for both triggers.
        run: |
          if ! echo "$TAG_NAME" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9.]+)?$'; then
            echo "TAG_NAME '$TAG_NAME' does not match expected semver shape (X.Y.Z or X.Y.Z-suffix; no leading zeros)"
            exit 1
          fi
          echo "TAG_NAME validated: $TAG_NAME"

      - name: Checkout the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0   # so CHANGELOG-extraction can see history

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean, deterministic)
        run: npm ci

      - name: Typecheck (TypeScript, all packages)
        run: npm run typecheck

      - name: Build plugin bundle
        run: npm run build

      - name: Verify build outputs are present
        run: |
          test -f main.js       || { echo "main.js missing after build"; exit 1; }
          test -f manifest.json || { echo "manifest.json missing"; exit 1; }
          test -f styles.css    || { echo "styles.css missing"; exit 1; }
          test -d hooks         || { echo "hooks/ directory missing"; exit 1; }
          ls -la main.js manifest.json styles.css
          ls -la hooks/

      - name: Verify tag matches manifest.version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag $TAG_NAME does not match manifest.version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Tag and manifest agree on version: $TAG_NAME"

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Grab everything from `## [<version>]` down to (but not including)
          # the next `## [` heading. CHANGELOG is newest-first so the slice
          # is contiguous. $TAG_NAME is either a Git tag (constrained to a
          # safe character set) or a workflow_dispatch input from a repo
          # maintainer — either way safe to splice into the awk pattern
          # after a literal-anchor regex.
          awk -v ver="$TAG_NAME" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Could not extract notes for $TAG_NAME from CHANGELOG.md"
            exit 1
          fi
          echo "notes-file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Gryphon ${{ env.TAG_NAME }}"
          body_path: ${{ steps.notes.outputs.notes-file }}
          prerelease: ${{ contains(env.TAG_NAME, '-') }}
          files: |
            main.js
            manifest.json
            styles.css

  # npm: the four @polleoai/gryphon-* packages are staged for the maintainer
  # to approve (npm "staged publishing": nothing is installable until a
  # maintainer approves it with 2FA — `npm stage approve <id>` or npmjs.com).
  #
  # Two jobs, so the publishing credential never meets third-party code:
  #   npm-build  — no id-token. Installs (dependency install scripts run
  #                here), builds, rebuilds the packages and checks them file
  #                for file against .github/npm-manifest.json — the record the
  #                release tooling wrote from the packages it built and
  #                scanned — so what's staged is what was scanned (it catches
  #                toolchain or dependency drift; it is not an authorization
  #                check). Hands over only the verified tarballs.
  #   npm-stage  — id-token for npm trusted publishing (OIDC: no stored
  #                token; npm accepts this workflow in this repo only). No
  #                checkout, no install of project dependencies, no build:
  #                it downloads the verified tarballs and stages them.
  #
  # Both run only for a pushed release tag — never for a pre-release tag (an
  # rc must not become npm's "latest") and not for a workflow_dispatch re-run
  # (those re-attest the GitHub release only; re-run a tag's original run to
  # retry npm). Who may
  # stage at all is decided by the maintainer's 2FA approval on npm. A
  # version already published is skipped, so re-running an approved release
  # stays green; a version still staged but unapproved isn't visible to
  # `npm view` — approve or reject it before re-running, or the re-stage fails.
  npm-build:
    needs: build-and-release
    # Gate and action use the same field: only a tag PUSH, and every step
    # below uses github.ref_name (the pushed tag) — never the dispatch input.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean, deterministic)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Rebuild the packages and check them against the release record
        run: |
          test -f .github/npm-manifest.json || { echo ".github/npm-manifest.json missing — this release wasn't cut with npm staging"; exit 1; }
          node .github/scripts/npm-pack.mjs --out "$RUNNER_TEMP/npm" --verify .github/npm-manifest.json --version "$RELEASE_TAG"

      - name: Record each tarball's integrity (matches npm's dist.integrity once approved)
        run: |
          for t in "$RUNNER_TEMP"/npm/*.tgz; do
            echo "$(basename "$t") sha512-$(openssl dgst -sha512 -binary "$t" | base64 -w0)"
          done

      - name: Hand over the verified tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  npm-stage:
    needs: npm-build
    # GitHub enforces this environment's rule (deployments only from tags
    # shaped X.Y.Z) and npm's trusted publisher requires it, so an edited copy
    # of this workflow run from a branch can't stage anything.
    environment: npm
    if: ${{ github.event_name == 'push' }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for npm trusted publishing — this job only
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: npm with trusted publishing and staging (11.5.1+)
        run: |
          npm install -g npm@11.21.0
          npm --version

      - name: Fetch the verified tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm

      - name: Stage on npm
        run: |
          set -euo pipefail
          staged=0
          for tgz in "$RUNNER_TEMP"/npm/*.tgz; do
            name=$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            # 404 = not published yet; any other failure stops the job rather
            # than being read as "not there".
            if out=$(npm view "$name@$RELEASE_TAG" version 2>&1); then
              echo "$name@$RELEASE_TAG is already on npm — skipped"
              continue
            elif ! grep -q "E404" <<<"$out"; then
              echo "Couldn't check $name@$RELEASE_TAG on npm:"; echo "$out"; exit 1
            fi
            npm stage publish "$tgz"
            staged=$((staged + 1))
          done
          echo "Staged $staged package(s) for $RELEASE_TAG. Approve with: npm stage list, then npm stage approve <id>"
